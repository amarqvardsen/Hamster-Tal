<style>
/* Layout idea: paper sheet, pencil outlines. Left = hamster with speech bubble, right = input. */
:root{
  --paper:#fbf8f1; --pencil:#4a4a52; --ink:#2b2d33;
  --pink:#ffc9d4; --sun:#ffd34e; --mint:#9be7c4; --sky:#a9d8ff; --grape:#d3c4ff;
  --font:'Baloo 2',ui-rounded,'SF Pro Rounded','Chalkboard SE','Comic Sans MS',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--paper);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body{background-image:radial-gradient(#e6dfcf 1px,transparent 1.3px);background-size:22px 22px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid #5b8cff;outline-offset:2px}

#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;gap:1.2vmin;
  padding:max(1.6vmin,env(safe-area-inset-top)) max(2.2vmin,env(safe-area-inset-right)) max(1.8vmin,env(safe-area-inset-bottom)) max(2.2vmin,env(safe-area-inset-left))}
#top{display:flex;align-items:center;gap:1.6vmin;height:8vmin;min-height:34px}
.ib{flex:0 0 auto;width:8vmin;height:8vmin;min-width:34px;min-height:34px;border-radius:50%;border:max(2.5px,.5vmin) solid var(--pencil);background:#fff;font-size:4.2vmin;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 .6vmin 0 var(--pencil)}
.ib:active{transform:translateY(.5vmin);box-shadow:0 .1vmin 0 var(--pencil)}
#dots{flex:1;display:flex;gap:1vmin;align-items:center;min-width:0}
.dot{flex:1 1 0;max-width:5vmin;height:2.6vmin;min-height:11px;border-radius:50% / 60%;border:max(2px,.4vmin) solid var(--pencil);background:#fff;transition:background .3s,transform .3s}
.dot.done{background:var(--sun)}
.dot.now{transform:scale(1.25);background:var(--pink)}
#stars{font-weight:800;font-size:4.4vmin;background:#fff;border:max(2.5px,.5vmin) solid var(--pencil);border-radius:99px;padding:0 2vmin;height:8vmin;min-height:34px;display:flex;align-items:center;gap:.8vmin;white-space:nowrap}
.sigTop{height:7.4vmin;min-height:30px;width:auto;opacity:.9;margin-left:.5vmin}

#main{display:grid;grid-template-columns:1.2fr 1fr;gap:2.6vmin;min-height:0}
@media (orientation:portrait){#main{grid-template-columns:1fr;grid-template-rows:1fr 1.2fr}}

#scene{display:flex;align-items:flex-end;min-height:0;position:relative}
#ham{height:76%;aspect-ratio:4/5;flex:0 0 auto;position:relative;z-index:2}
#ham svg{width:100%;height:100%;overflow:visible;transform-origin:50% 92%;animation:breathe 3.2s ease-in-out infinite}
#ham.pop svg{animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
#ham.jump svg{animation:jump .8s ease-in-out 2}
#ham.shake svg{animation:shake .55s ease-in-out}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes popin{0%{transform:scale(.2) translateY(30%);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.06,.94)}30%{transform:translateY(-14%) scale(.95,1.06)}60%{transform:translateY(0) scale(1.07,.93)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}

#bubble{position:relative;z-index:1;flex:1;min-width:0;align-self:center;margin-left:-3.4vmin;height:64%;background:#fff;
  border:max(3px,.6vmin) solid var(--pencil);border-radius:5vmin;box-shadow:.9vmin .9vmin 0 rgba(74,74,82,.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.4vmin 2.4vmin 1vmin 4vmin}
#bubble::before{content:"";position:absolute;left:max(-1.9vmin,-14px);top:60%;width:max(3.2vmin,22px);height:max(3.2vmin,22px);background:#fff;
  border-left:max(3px,.6vmin) solid var(--pencil);border-bottom:max(3px,.6vmin) solid var(--pencil);transform:rotate(45deg)}
#bubble.pop{animation:bubin .45s cubic-bezier(.3,1.5,.5,1)}
#bubble.shake{animation:shake .5s}
@keyframes bubin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#say{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
#sayTxt{white-space:nowrap;font-weight:800;line-height:1.05;color:var(--ink)}
#sub{min-height:1.5em;font-size:max(14px,3.3vmin);font-weight:600;text-align:center;color:#7d7d89;line-height:1.2}
#sub.good{color:#1f9d6b}
#sub.bad{color:#d4564a}

#input{display:flex;flex-direction:column;min-height:0}
#input.a #panelB{display:none}
#input.b #panelA{display:none}
#panelA,#panelB{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.6vmin}
#disp{flex:0 0 19%;background:#fff;border:max(3px,.6vmin) solid var(--pencil);border-radius:3vmin;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:min(10vmin,13vh);letter-spacing:.6vmin;box-shadow:.8vmin .8vmin 0 rgba(74,74,82,.16)}
#disp.empty{color:#c5c2b8}
#disp.wrong{animation:shake .5s;background:#ffe9e6}
#pad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:1.5vmin}
.key,.choice{font-weight:800;background:#fff;border:max(3px,.55vmin) solid var(--pencil);border-radius:2.8vmin;box-shadow:0 .9vmin 0 var(--pencil);padding:0;min-height:0;touch-action:manipulation;transition:transform .08s,box-shadow .08s}
.key{font-size:min(7vmin,9.5vh)}
.key:active,.choice:active{transform:translateY(.7vmin);box-shadow:0 .2vmin 0 var(--pencil)}
.key.ok{background:var(--mint);font-size:min(5.6vmin,7.5vh)}
.key.del{background:var(--pink)}
#panelB{display:grid;grid-template-rows:repeat(4,1fr)}
.choice{display:flex;align-items:center;justify-content:center;padding:0 2vmin;overflow:hidden}
.choice:nth-child(1){background:var(--sky)}
.choice:nth-child(2){background:var(--mint)}
.choice:nth-child(3){background:#ffe58a}
.choice:nth-child(4){background:var(--grape)}
.choice span{white-space:nowrap}
.choice.nope{opacity:.3;transform:scale(.96);box-shadow:none;pointer-events:none}
.choice.shake{animation:shake .45s}

/* screens */
.screen{position:fixed;inset:0;z-index:20;display:none;background:var(--paper);background-image:radial-gradient(#e6dfcf 1px,transparent 1.3px);background-size:22px 22px;
  padding:max(2vmin,env(safe-area-inset-top)) max(3vmin,env(safe-area-inset-right)) max(2vmin,env(safe-area-inset-bottom)) max(3vmin,env(safe-area-inset-left))}
.screen.show{display:grid;grid-template-columns:1.1fr 1fr;gap:3vmin;align-items:center}
@media (orientation:portrait){.screen.show{grid-template-columns:1fr;align-content:center}}
.left,.right{display:flex;flex-direction:column;align-items:center;gap:2vmin;min-height:0}
h1{margin:0;font-size:min(13vmin,17vh);line-height:1;font-weight:800;letter-spacing:.2vmin;text-align:center}
h1 span{display:inline-block}
.row4{display:flex;align-items:flex-end;justify-content:center;gap:1vmin;height:min(30vmin,34vh)}
.row4 svg{height:100%;width:auto;aspect-ratio:4/5;overflow:visible}
.row4 svg:nth-child(odd){animation:breathe 3s ease-in-out infinite}
.row4 svg:nth-child(even){animation:breathe 3.6s ease-in-out infinite reverse}
.by{display:flex;align-items:center;gap:1.4vmin;font-size:max(13px,3.2vmin);color:#7d7d89;font-weight:600}
.sigBig{height:min(14vmin,17vh);width:auto}
.grp{width:100%;display:flex;flex-direction:column;align-items:center;gap:1.2vmin}
.grp b{font-size:max(15px,3.8vmin);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:1.4vmin;justify-content:center}
.chip{font-weight:800;font-size:max(15px,4vmin);padding:.8vmin 2.6vmin;border-radius:99px;border:max(3px,.5vmin) solid var(--pencil);background:#fff;box-shadow:0 .7vmin 0 var(--pencil)}
.chip[aria-pressed="true"]{background:var(--sun)}
.big{font-weight:800;font-size:min(8vmin,11vh);padding:.6vmin 7vmin;border-radius:99px;border:max(3.5px,.6vmin) solid var(--pencil);background:var(--mint);box-shadow:0 1vmin 0 var(--pencil);animation:wiggle 2s ease-in-out infinite}
.big:active{transform:translateY(.8vmin);box-shadow:0 .2vmin 0 var(--pencil)}
.big.alt{background:#fff;font-size:min(5.4vmin,8vh);animation:none}
@keyframes wiggle{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) scale(1.03)}}
#endHam{height:min(40vmin,46vh);aspect-ratio:4/5}

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- tal til ord ---------- */
const U=['','en','to','tre','fire','fem','seks','syv','otte','ni','ti','elleve','tolv','tretten','fjorten','femten','seksten','sytten','atten','nitten'];
const T={2:'tyve',3:'tredive',4:'fyrre',5:'halvtreds',6:'tres',7:'halvfjerds',8:'firs',9:'halvfems'};
function word(n){
  if(n===100)return 'hundrede';
  if(n<20)return U[n];
  const t=Math.floor(n/10),u=n%10;
  return u?U[u]+'og'+T[t]:T[t];
}

/* ---------- hamstre ---------- */
const INK='#55555d',PINK='#ffc2cf';
/* Fire hamstre efter Bettys tegning: 4 aar, 5 aar, 44 aar, 45 aar. Alle er glade. */
const CHARS=[
  {w:124,wt:112,h:172,tint:'#fff6e8',face:'wink', arms:'paws', shade:'low'},
  {w:98, wt:92, h:164,tint:'#fffaf3',face:'round',arms:'reach'},
  {w:118,wt:112,h:208,tint:'#eff4fd',face:'closed',arms:'wide', belly:true},
  {w:114,wt:104,h:198,tint:'#fdede8',face:'wink2',arms:'paws', shade:'top'}
];
function bigEye(x,y,r){
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/>
  <circle cx="${x}" cy="${y}" r="${r*.78}" fill="#76707a" stroke="none"/>
  <circle cx="${x}" cy="${y}" r="${r*.4}" fill="#1f1f24" stroke="none"/>
  <circle cx="${x+r*.28}" cy="${y-r*.3}" r="${r*.2}" fill="#fff" stroke="none"/>`;
}
function ham(c,mood){
  const b=218,t=b-c.h,a=c.wt/2,cc=c.w/2,W=c.w;
  const happy=mood==='happy',oops=mood==='oops';
  const fy=t+c.h*.16+8,fcx=100+W*.05;
  const body=`M100 ${t} C${100+a*.62} ${t} ${100+a} ${t+c.h*.1} ${100+a} ${t+c.h*.28} C${100+a} ${t+c.h*.55} ${100+cc} ${t+c.h*.62} ${100+cc} ${t+c.h*.78} C${100+cc} ${t+c.h*.94} ${100+cc*.6} ${b} 100 ${b} C${100-cc*.6} ${b} ${100-cc} ${t+c.h*.94} ${100-cc} ${t+c.h*.78} C${100-cc} ${t+c.h*.62} ${100-a} ${t+c.h*.55} ${100-a} ${t+c.h*.28} C${100-a} ${t+c.h*.1} ${100-a*.62} ${t} 100 ${t}Z`;
  let s=`<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`;
  s+=`<g stroke="#a9a9b2" stroke-width="2" stroke-linecap="round" fill="none">`;
  for(let k=0;k<5;k++){const y=226+k*5.5,x0=34+(k%2)*8,x1=166-(k%2)*10;s+=`<path d="M${x0} ${y} Q${(x0+x1)/2} ${y+3} ${x1} ${y} q9 2 -5 4"/>`;}
  s+=`</g><g filter="url(#wob)" stroke="${INK}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none">`;
  for(const sx of [-1,1]){const ex=100+sx*(a*.8);s+=`<circle cx="${ex}" cy="${t+8}" r="12" fill="${c.tint}"/><circle cx="${ex}" cy="${t+9}" r="6" stroke-width="2"/>`;}
  for(const sx of [-1,1]){const fx=100+sx*cc*.8;s+=`<g transform="rotate(${sx*22} ${fx} ${b-4})"><ellipse cx="${fx}" cy="${b-4}" rx="15" ry="7" fill="${c.tint}"/><path d="M${fx+sx*6} ${b-1}v4M${fx+sx*11} ${b-3}v4" stroke-width="1.8"/></g>`;}
  s+=`<path d="${body}" fill="${c.tint}"/>`;
  if(c.shade==='low'){s+=`<g stroke="#bdbdc6" stroke-width="2"><path d="M${100-cc+14} ${t+c.h*.72}l10 14M${100-cc+10} ${t+c.h*.82}l12 12M${100-cc+22} ${t+c.h*.9}l12 8"/></g>`;}
  if(c.shade==='top'){s+=`<g stroke="#bdbdc6" stroke-width="2"><path d="M${100+a-8} ${t+10}l-14 6M${100+a-4} ${t+20}l-16 7M${100+a-2} ${t+31}l-14 6"/></g>`;}
  const pawY=t+c.h*(c.arms==='paws'?.46:.5);
  const paw=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="12" ry="8" fill="${c.tint}"/><path d="M${x-6} ${y+1}v6M${x} ${y+2}v6M${x+6} ${y+1}v6" stroke-width="1.8"/>`;
  const limb=(sx,y)=>{const x0=100+sx*cc;return `<path d="M${x0} ${y-7} C${x0+sx*12} ${y-10} ${x0+sx*24} ${y-8} ${x0+sx*31} ${y} C${x0+sx*26} ${y+9} ${x0+sx*12} ${y+9} ${x0} ${y+7}" fill="${c.tint}"/><path d="M${x0+sx*28} ${y-3}l${sx*5} -3M${x0+sx*30} ${y+2}l${sx*5} 0M${x0+sx*28} ${y+6}l${sx*5} 3" stroke-width="1.8"/>`;};
  if(c.arms==='paws'){s+=paw(fcx-W*.22,pawY)+paw(fcx+W*.18,pawY);}
  if(c.arms==='reach'){s+=limb(-1,pawY)+`<ellipse cx="${100+cc-9}" cy="${pawY+22}" rx="7" ry="23" fill="${c.tint}"/><path d="M${100+cc-12} ${pawY+40}v5M${100+cc-8} ${pawY+41}v5" stroke-width="1.8"/>`;}
  if(c.arms==='wide'){s+=limb(-1,pawY)+limb(1,pawY);}
  if(c.belly){const bx=fcx,by=t+c.h*.54;s+=`<ellipse cx="${bx}" cy="${by}" rx="15" ry="11" stroke="#b2b2bb" stroke-width="2"/><path d="M${bx-6} ${by-1}v6M${bx} ${by}v6M${bx+6} ${by-1}v6" stroke="#b2b2bb" stroke-width="1.8"/>`;}
  const arc=(x,y)=>`<path d="M${x-12} ${y+3} Q${x} ${y-9} ${x+12} ${y+3}" stroke-width="3.2"/>`;
  const dot=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="2.6" ry="2" fill="#2a2a30" stroke="none"/>`;
  const omega=(x,y,m)=>`<path d="M${x-m} ${y} Q${x-m/2} ${y+m*.8} ${x} ${y} Q${x+m/2} ${y+m*.8} ${x+m} ${y}" stroke-width="2.2"/>`;
  const openMouth=(x,y)=>`<path d="M${x-10} ${y-2} Q${x} ${y+19} ${x+10} ${y-2}Z" fill="#ff8fa3" stroke-width="2.4"/>`;
  const sp=c.face==='round'||c.face==='closed'?W*.2:W*.17;
  const e1=fcx-sp,e2=fcx+sp;
  let nose=fy+13;
  if(happy){
    s+=arc(e1,fy)+arc(e2,fy)+dot(fcx,fy+11)+openMouth(fcx,fy+17);
    for(const x of [e1-W*.1,e2+W*.1])s+=`<ellipse cx="${x}" cy="${fy+14}" rx="9" ry="6" fill="#ffadbd" stroke="none" opacity=".75"/>`;
  }else if(oops){
    for(const x of [e1,e2])s+=`<circle cx="${x}" cy="${fy}" r="13" fill="#fff"/><circle cx="${x+1}" cy="${fy+2}" r="5" fill="#2a2a30" stroke="none"/>`;
    s+=dot(fcx,fy+15)+`<ellipse cx="${fcx}" cy="${fy+24}" rx="4.5" ry="5.5" fill="#ff9aae" stroke-width="2"/>`;
  }else if(c.face==='wink'){
    s+=bigEye(e1,fy,15)+arc(e2,fy)+dot(fcx,nose-2);
  }else if(c.face==='wink2'){
    s+=bigEye(e1,fy,14)+`<path d="M${e2+8} ${fy-9}L${e2-5} ${fy}L${e2+8} ${fy+9}" stroke-width="3.2"/>`+dot(fcx,nose-2);
  }else if(c.face==='round'){
    s+=bigEye(e1,fy,15)+bigEye(e2,fy,15)+omega(fcx,fy+21,6.5);
  }else{
    s+=arc(e1,fy)+arc(e2,fy)+dot(fcx,fy+8)+omega(fcx,fy+13,12);
  }
  s+=`</g>`;
  if(oops)s+=`<text x="${100+a*.7}" y="${t-6}" font-size="26" font-weight="800" fill="#8d95c4" font-family="sans-serif">?</text>`;
  return s+`</svg>`;
}

let ac=null;
function audio(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C();}if(ac&&ac.state==='suspended')ac.resume();}catch(e){}return ac;}
function tone(f,t,d,type,v){const a=audio();if(!a||!S.sound)return;try{const o=a.createOscillator(),g=a.createGain(),st=a.currentTime+t;o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(v||.15,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+d);o.connect(g);g.connect(a.destination);o.start(st);o.stop(st+d+.05);}catch(e){}}
const WIN=[[523,659,784,1047],[392,523,659,784,1047],[659,784,988,1319],[523,587,659,784,880,1047],[440,554,659,880,1109]];

const cv=$('fx'),cx=cv.getContext('2d');
let W=0,H=0,parts=[],raf=0,lastT=0;
function sizeFx(){const d=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);}
const COLS=['#ff6b6b','#ffd34e','#5fd6a4','#5eb4ff','#b79cff','#ff9ed2','#ffa94d'];
function P(o){return Object.assign({x:0,y:0,vx:0,vy:0,g:0,drag:0,rot:0,vr:0,age:0,life:3,size:8,color:pick(COLS),sway:0,sf:3,ph:R(0,6),up:false},o);}
function step(p,dt){
  p.vy+=p.g*dt;
  if(p.drag){const k=Math.max(0,1-p.drag*dt);p.vx*=k;p.vy*=k;}
  p.x+=p.vx*dt+(p.sway?Math.cos(p.age*p.sf+p.ph)*p.sway*dt:0);
  p.y+=p.vy*dt;p.rot+=p.vr*dt;
}
function starPath(r){cx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}cx.closePath();}
function heartPath(s){cx.beginPath();cx.moveTo(0,s*.35);cx.bezierCurveTo(-s*1.1,-s*.4,-s*.5,-s*1.1,0,-s*.45);cx.bezierCurveTo(s*.5,-s*1.1,s*1.1,-s*.4,0,s*.35);cx.closePath();}
function draw(p){
  const fade=Math.min(1,(p.life-p.age)/(p.life*.3));
  cx.save();cx.globalAlpha=Math.max(0,fade);
  switch(p.kind){
    case 'conf':cx.translate(p.x,p.y);cx.rotate(p.rot);cx.scale(1,Math.cos(p.age*p.flip));cx.fillStyle=p.color;cx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.62);break;
    case 'spark':cx.strokeStyle=p.color;cx.lineCap='round';cx.lineWidth=p.size;cx.beginPath();cx.moveTo(p.x-p.vx*.05,p.y-p.vy*.05);cx.lineTo(p.x,p.y);cx.stroke();break;
    case 'star':cx.translate(p.x,p.y);cx.rotate(p.rot);starPath(p.size);cx.fillStyle='#ffd34e';cx.strokeStyle='#ffa800';cx.lineWidth=2;cx.lineJoin='round';cx.fill();cx.stroke();break;
    case 'heart':cx.translate(p.x,p.y);cx.rotate(Math.sin(p.age*2+p.ph)*.25);heartPath(p.size);cx.fillStyle=p.color;cx.fill();break;
    case 'emoji':cx.translate(p.x,p.y);cx.rotate(p.rot);cx.font=p.size+'px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.ch,0,0);break;
    case 'balloon':{
      cx.translate(p.x,p.y);const r=p.size;
      cx.strokeStyle='rgba(74,74,82,.55)';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(0,r*1.2);cx.quadraticCurveTo(Math.sin(p.age*3+p.ph)*10,r*2.2,0,r*3.2);cx.stroke();
      cx.fillStyle=p.color;cx.beginPath();cx.ellipse(0,0,r,r*1.18,0,0,7);cx.fill();
      cx.beginPath();cx.moveTo(0,r*1.15);cx.lineTo(-r*.14,r*1.4);cx.lineTo(r*.14,r*1.4);cx.closePath();cx.fill();
      cx.fillStyle='rgba(255,255,255,.55)';cx.beginPath();cx.ellipse(-r*.35,-r*.4,r*.18,r*.3,.5,0,7);cx.fill();break;}
  }
  cx.restore();
}
function loop(t){
  const dt=Math.min(.033,(t-lastT)/1000||.016);lastT=t;
  cx.clearRect(0,0,W,H);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.age+=dt;
    if(p.age>=p.life||p.y>H+120||(p.up&&p.y<-140)){parts.splice(i,1);continue;}
    step(p,dt);draw(p);
  }
  if(parts.length)raf=requestAnimationFrame(loop);else{raf=0;cx.clearRect(0,0,W,H);}
}
function add(ps){for(const p of ps)parts.push(p);if(!raf){lastT=performance.now();raf=requestAnimationFrame(loop);}}
const N=n=>Math.round(n*(reduce?.4:1));

function fxConfetti(){
  const ps=[];
  for(let i=0;i<N(130);i++)ps.push(P({kind:'conf',x:R(0,W),y:R(-H*.5,-10),vx:R(-50,50),vy:R(60,200),g:260,drag:1.2,rot:R(0,6),vr:R(-6,6),flip:R(4,10),size:R(9,16),life:R(3,4.4),sway:R(10,40)}));
  for(const side of [0,1])for(let i=0;i<N(55);i++){
    const th=R(.15,.65),sp=R(750,1250),dir=side?-1:1;
    ps.push(P({kind:'conf',x:side?W:0,y:H*.9,vx:dir*sp*Math.sin(th),vy:-sp*Math.cos(th),g:800,drag:1.6,rot:R(0,6),vr:R(-9,9),flip:R(5,12),size:R(9,16),life:R(2.6,3.6)}));
  }
  add(ps);
}
function burst(x,y){
  const c1=pick(COLS),c2=pick(COLS),ps=[],n=N(70);
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+R(-.05,.05),sp=R(140,430);
    ps.push(P({kind:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:230,drag:1.9,size:R(2.5,4.5),color:i%2?c1:c2,life:R(1,1.7)}));}
  for(let i=0;i<N(26);i++){const a=R(0,6.3),sp=R(40,200);
    ps.push(P({kind:'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:140,drag:1.5,size:2,color:'#fff',life:R(1.2,2)}));}
  add(ps);
}

const FX=[fxConfetti,fxFireworks,fxStars,fxHearts,fxFood,fxBalloons];

const CHEERS=['Hurra!','Fedt!','Super!','Wow!','Sådan!','Flot klaret!','Fantastisk!','Du er vildt god!','Tjuhej!','Perfekt!','Yes!','Hamster-hurra!','Sejt!','Mega godt!'];

/* ---------- spil ---------- */
const S={range:100,mode:'mix',queue:[],idx:0,stars:0,tries:0,locked:true,entry:'',cur:null,sound:true,char:0,playing:false};
try{const r=localStorage.getItem('ht_range'),m=localStorage.getItem('ht_mode');if(r)S.range=+r;if(m)S.mode=m;}catch(e){}

function setHam(mood,anim){
  const h=$('ham');h.innerHTML=ham(CHARS[S.char],mood);
  h.classList.remove('pop','jump','shake');
  if(anim){void h.offsetWidth;h.classList.add(anim);}
}
function fitEl(span,boxW,maxPx){
  let s=maxPx;span.style.fontSize=s+'px';
  for(let i=0;i<40&&span.offsetWidth>boxW&&s>10;i++){s*=.93;span.style.fontSize=s+'px';}
}
function layoutFit(){
  if(!S.cur)return;
  const box=$('say'),t=$('sayTxt');
  const isWord=S.cur.type==='a';
  fitEl(t,box.clientWidth-4,Math.min(box.clientHeight*(isWord?.6:.95),isWord?110:170));
  document.querySelectorAll('.choice').forEach(b=>{const sp=b.firstChild;fitEl(sp,b.clientWidth-b.clientWidth*.08-10,Math.min(b.clientHeight*.52,70));});
}
function buildQueue(){
  const nums=shuffle(Array.from({length:S.range},(_,i)=>i+1)).slice(0,10);
  return nums.map(n=>({n,type:S.mode==='mix'?pick(['a','b']):S.mode}));
}
function drawDots(){
  const d=$('dots');d.innerHTML='';
  S.queue.forEach((q,i)=>{const e=document.createElement('span');e.className='dot'+(i<S.idx?' done':i===S.idx?' now':'');d.appendChild(e);});
}
function choicesFor(n){
  const t=Math.floor(n/10),u=n%10,cand=[];
  if(n>=10&&n<100){const sw=u*10+t;if(sw!==n)cand.push(sw);}
  [1,-1,10,-10,2,-2].forEach(d=>cand.push(n+d));
  for(let k=0;k<10;k++){cand.push(k*10+u);cand.push(t*10+k);}
  let pool=[...new Set(cand)].filter(x=>x>=1&&x<=S.range&&x!==n);
  shuffle(pool);
  const out=pool.slice(0,3);
  while(out.length<3){const x=1+Math.floor(Math.random()*S.range);if(x!==n&&!out.includes(x))out.push(x);}
  return shuffle([n,...out]);
}
function showTask(){
  if(S.idx>=S.queue.length){finish();return;}
  const cur=S.cur=S.queue[S.idx];
  S.tries=0;S.locked=false;S.entry='';
  let c;do{c=Math.floor(Math.random()*CHARS.length);}while(c===S.char&&CHARS.length>1);
  S.char=c;setHam('idle','pop');
  const b=$('bubble');b.classList.remove('pop','shake');void b.offsetWidth;b.classList.add('pop');
  const inp=$('input');
  $('sub').className='';
  if(cur.type==='a'){
    inp.className='a';$('sayTxt').textContent=word(cur.n);$('sub').textContent='Hvilket tal er det?';updDisp();
  }else{
    inp.className='b';$('sayTxt').textContent=String(cur.n);$('sub').textContent='Hvad hedder tallet?';
    const pb=$('panelB');pb.innerHTML='';
    choicesFor(cur.n).forEach(n=>{const bt=document.createElement('button');bt.className='choice';bt.dataset.n=n;bt.innerHTML='<span></span>';bt.firstChild.textContent=word(n);pb.appendChild(bt);});
  }
  drawDots();
  requestAnimationFrame(layoutFit);
}
function updDisp(){const d=$('disp');$('dispTxt').textContent=S.entry||'?';d.classList.toggle('empty',!S.entry);}
function next(){S.idx++;showTask();}
function requeue(){
  const c=S.cur;if(c.again)return;
  const ins=Math.min(S.idx+3,S.queue.length);
  S.queue.splice(ins,0,{n:c.n,type:c.type==='a'?'b':'a',again:true});
}
function right(){
  S.locked=true;
  const c=S.cur;
  const first=S.tries===0;
  if(first&&!c.again)S.stars++;
  $('starN').textContent=S.stars;
  $('sub').className='good';$('sub').textContent=word(c.n)+' = '+c.n;
  if(c.type==='a')$('sayTxt').textContent=word(c.n);
  layoutFit();
  setHam('happy','jump');celebrate();cheer();
  if(!first)requeue();
  setTimeout(()=>{if(S.playing)next();},2300);
}
function wrong(btn){
  S.tries++;playOops();
  setHam('oops','shake');
  setTimeout(()=>{if(!S.locked&&S.playing)setHam('idle');},900);
  if(!S.cur.failedFlag){S.cur.failedFlag=true;}
  $('sub').className='bad';
  const b=$('bubble');b.classList.remove('shake','pop');void b.offsetWidth;b.classList.add('shake');
  if(btn){btn.classList.add('nope');$('sub').textContent='Næsten! Prøv igen';}
  else{
    const d=$('disp');d.classList.remove('wrong');void d.offsetWidth;d.classList.add('wrong');
    S.entry='';updDisp();
    if(S.tries>=3){
      S.locked=true;requeue();
      $('sub').textContent='Det var '+S.cur.n+'. Vi prøver igen senere!';
      setTimeout(()=>{if(S.playing)next();},3200);return;
    }
    $('sub').textContent='Næsten! Prøv igen';
  }
}
function press(k){
  if(S.locked||!S.playing||S.cur.type!=='a')return;
  audio();
  if(k==='del'){S.entry=S.entry.slice(0,-1);tick();updDisp();}
  else if(k==='ok'){
    if(!S.entry)return;
    const v=parseInt(S.entry,10);
    if(v===S.cur.n){right();}else wrong(null);
  }else{
    if(S.entry.length>=3)return;
    S.entry=S.entry==='0'?k:S.entry+k;tick();updDisp();
  }
}
function pickChoice(btn){
  if(S.locked||!S.playing)return;
  audio();
  if(+btn.dataset.n===S.cur.n){right();}
  else{btn.classList.add('shake');wrong(btn);}
}
function finish(){
  S.playing=false;S.locked=true;
  const total=10,s=S.stars;
  $('end').classList.add('show');
  $('endHam').innerHTML=ham(CHARS[Math.floor(Math.random()*CHARS.length)],'happy');
  $('endTitle').textContent=s>=9?'Vildt godt!':s>=6?'Rigtig flot!':'Godt kæmpet!';
  $('endStars').textContent='⭐'.repeat(s)+'☆'.repeat(Math.max(0,total-s));
  $('endMsg').textContent=s>=9?'Du kan næsten alle tallene!':s>=6?'Du bliver bedre og bedre.':'Øvelse gør mester. Prøv en gang til!';
  mega();
}
function startGame(){
  audio();
  S.queue=buildQueue();S.idx=0;S.stars=0;S.playing=true;
  $('starN').textContent='0';
  $('start').classList.remove('show');$('end').classList.remove('show');

}
